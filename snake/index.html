<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scene-backdrop"></div>
    <div class="scene-glow scene-glow-one"></div>
    <div class="scene-glow scene-glow-two"></div>

    <div class="app-shell">
        <header class="hud">
            <div class="brand">Neon Snake</div>
            <div class="stats">
                <div class="stat">
                    <span>Score</span>
                    <strong id="score">0</strong>
                </div>
                <div class="stat">
                    <span>Best</span>
                    <strong id="best">0</strong>
                </div>
                <div class="stat">
                    <span>Level</span>
                    <strong id="level">1</strong>
                </div>
            </div>
        </header>

        <div class="canvas-shell">
            <canvas id="gameCanvas" width="720" height="720"></canvas>
        </div>

        <div class="controls">
            <button id="startBtn">Iniciar Jogo</button>
            <button id="pauseBtn" disabled>Pausar</button>
            <button id="fullscreenBtn">Tela cheia</button>
        </div>

        <div class="status-bar" id="statusText">Mapa 1 · Neon Garden</div>

        <div class="menu-screen" id="menuScreen">
            <div class="menu-panel">
                <h2>Escolha sua cobra</h2>
                <div class="snake-picker">
                    <button class="snake-option active" data-snake="classic">Classic</button>
                    <button class="snake-option" data-snake="blaze">Blaze</button>
                    <button class="snake-option" data-snake="shadow">Shadow</button>
                    <button class="snake-option" data-snake="titan">Titan</button>
                </div>
                <p>Se movimente com as setas, use espaço para pausar e sobreviva aos mapas.</p>
                <button id="playBtn" class="primary">Jogar</button>
            </div>
        </div>

        <div class="game-over" id="gameOver" style="display: none;">
            <div class="game-over-content">
                <h2>Game Over</h2>
                <p>Sua pontuação: <span id="finalScore">0</span></p>
                <button id="restartBtn" class="danger">Jogar Novamente</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
